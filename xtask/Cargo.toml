[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
regex = { workspace = true }
# `check-api`: parse the published crates' sources; line numbers need
# `span-locations`.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }
toml = "1"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
vision-calibration-core = { workspace = true, features = ["schemars"] }
vision-calibration-pipeline = { workspace = true, features = ["schemars"] }
vision-calibration-optim = { workspace = true, features = ["schemars"] }
vision-calibration-dataset = { workspace = true, features = ["schemars"] }
vision-calibration-bench = { workspace = true, features = ["schema"] }
