# Public types that stay exhaustive because their shape is fixed by
# definition; `cargo xtask check-api` reports every other public struct with
# all-public fields, and every public enum, that is not `#[non_exhaustive]`.
#
# One table per type, keyed `crate::Type` (or `crate::module::Type` when a
# crate has two of the name), with the reason its shape cannot grow. An entry
# that no longer matches a reported type fails the check.

