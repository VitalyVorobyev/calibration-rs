# `cargo audit` configuration — the single source of truth for advisory
# ignores, read by both a developer's local `cargo audit` and the
# `Security Audit` workflow, so a local run agrees with CI.
#
# Ignore an advisory only when no upgrade path is under our control. Each
# entry states why it does not affect us and what to re-check. The weekly
# run on `main` files an issue for every finding, warnings included, so an
# advisory we can fix is fixed (usually `cargo update`), not listed here.

[advisories]
ignore = [
    # `paste` is unmaintained. Build-time proc-macro only, pulled in via
    # gemm -> faer -> tiny-solver, simba -> nalgebra, and rav1e -> image.
    # Re-check when those upstreams move to `pastey`.
    "RUSTSEC-2024-0436",
    # Desktop app, Linux only: Tauri 2's GTK3 stack pins `glib` 0.18
    # (gtk 0.18 -> webkit2gtk 2). The unsound code is `VariantStrIter`,
    # which neither the app nor tao / wry / muda / webkit2gtk call.
    # Re-check when Tauri moves to glib >= 0.20 (gtk4).
    "RUSTSEC-2024-0429",
    # Desktop app, Linux only: `proc-macro-error` (unmaintained) is a
    # build-time proc-macro dependency of `glib-macros` 0.18, pinned by the
    # same GTK3 stack. Same re-check trigger.
    "RUSTSEC-2024-0370",
]
