[workspace]
members = [
    "crates/vision-calibration",
    "crates/vision-calibration-py",
    "crates/vision-calibration-core",
    "crates/vision-calibration-linear",
    "crates/vision-calibration-optim",
    "crates/vision-calibration-pipeline",
    "crates/vision-calibration-dataset",
    "crates/vision-calibration-detect",
    "crates/vision-calibration-bench",
    "crates/vision-geometry",
    "crates/vision-mvg",
    "xtask",
]
# `app/src-tauri/` is its own crate — it pulls in the Tauri build-time
# dep tree and is built from `app/` (or via `bun run tauri dev`), not
# from the workspace root. See ADR 0014.
exclude = ["app"]

resolver = "2"

[workspace.package]
version = "0.8.1"
edition = "2024"
# MSRV is 1.93. Bumped from 1.88 on 2026-05-23 to drop the
# `fixed`/`kiddo` lockfile pins that kept breaking under `cargo update`.
# See docs/MSRV.md.
rust-version = "1.93"
license = "MIT"
authors = ["Vitaly Vorobyev <vit.vorobiev@gmail.com>"]
homepage = "https://vitalyvorobyev.github.io/calibration-rs"
repository = "https://github.com/VitalyVorobyev/calibration-rs"

[workspace.dependencies]
vision-calibration = { path = "./crates/vision-calibration", version = "0.8.1" }
vision-calibration-core = { path = "./crates/vision-calibration-core", version = "0.8.1" }
vision-calibration-linear = { path = "./crates/vision-calibration-linear", version = "0.8.1" }
vision-calibration-optim = { path = "./crates/vision-calibration-optim", version = "0.8.1" }
vision-calibration-pipeline = { path = "./crates/vision-calibration-pipeline", version = "0.8.1" }
vision-calibration-dataset = { path = "./crates/vision-calibration-dataset", version = "0.8.1" }
vision-calibration-detect = { path = "./crates/vision-calibration-detect", version = "0.8.1" }
vision-calibration-bench = { path = "./crates/vision-calibration-bench", version = "0.8.1" }
vision-geometry = { path = "./crates/vision-geometry", version = "0.8.1" }
vision-mvg = { path = "./crates/vision-mvg", version = "0.8.1" }

anyhow = "1"
thiserror = "2"
# nalgebra / faer / faer-ext are pinned by `tiny-solver` (below), not by
# taste: `vision-calibration-optim` hands nalgebra and faer types straight
# across the tiny-solver boundary (`Factor<T: nalgebra::RealField>`,
# `faer::sparse::SparseColMat`, `faer_ext::IntoNalgebra`), so all three must
# match whatever tiny-solver was built against. As of tiny-solver 0.18 that
# is nalgebra 0.34 / faer 0.23 / faer-ext 0.7. Bumping any of them ahead of
# tiny-solver does not compile — re-check on each tiny-solver release.
nalgebra = { version = "0.34", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
image = { version = "0.25" }

glob = "0.3"
regex = "1"
rand = { version = "0.10" }
tracing = { version = "0.1" }
tiny-solver = "0.18"
faer = "0.23"
faer-ext = "0.7"
criterion = "0.8"

# `calib-targets`' default feature set includes `cli`, which drags `clap` and
# a binary target into every consumer. We only need the `image`-backed
# `detect` helpers.
#
# The floor is 0.12.1, not 0.12: 0.12.0's grid builder could label a planar
# board non-projectively — several lattice nodes collapsed onto one pixel, or
# a sub-block displaced by a whole lattice step — which passes a corner-count
# check while making the view's pose meaningless.
calib-targets = { version = "0.12.1", default-features = false, features = ["image"] }
ringgrid = "0.11"

[workspace.lints.rust]
missing_docs = "warn"
