[workspace]
members = [
    "crates/vision-calibration",
    "crates/vision-calibration-py",
    "crates/vision-calibration-core",
    "crates/vision-calibration-linear",
    "crates/vision-calibration-optim",
    "crates/vision-calibration-pipeline",
    "crates/vision-calibration-dataset",
    "crates/vision-calibration-detect",
    "crates/vision-calibration-bench",
    "crates/vision-geometry",
    "crates/vision-mvg",
    "xtask",
]
# `app/src-tauri/` is its own crate — it pulls in the Tauri build-time
# dep tree and is built from `app/` (or via `bun run tauri dev`), not
# from the workspace root. See ADR 0014.
exclude = ["app"]

resolver = "2"

[workspace.package]
version = "0.12.0"
edition = "2024"
# MSRV policy: AGENTS.md §6.
rust-version = "1.93"
license = "MIT"
authors = ["Vitaly Vorobyev <vit.vorobiev@gmail.com>"]
homepage = "https://vitalyvorobyev.github.io/calibration-rs"
repository = "https://github.com/VitalyVorobyev/calibration-rs"

[workspace.dependencies]
vision-calibration = { path = "./crates/vision-calibration", version = "0.12.0" }
vision-calibration-core = { path = "./crates/vision-calibration-core", version = "0.12.0" }
vision-calibration-linear = { path = "./crates/vision-calibration-linear", version = "0.12.0" }
vision-calibration-optim = { path = "./crates/vision-calibration-optim", version = "0.12.0" }
vision-calibration-pipeline = { path = "./crates/vision-calibration-pipeline", version = "0.12.0" }
vision-calibration-dataset = { path = "./crates/vision-calibration-dataset", version = "0.12.0" }
vision-calibration-detect = { path = "./crates/vision-calibration-detect", version = "0.12.0" }
vision-calibration-bench = { path = "./crates/vision-calibration-bench", version = "0.12.0" }
vision-geometry = { path = "./crates/vision-geometry", version = "0.12.0" }
vision-mvg = { path = "./crates/vision-mvg", version = "0.12.0" }

anyhow = "1"
thiserror = "2"
# nalgebra / faer / faer-ext are pinned by the solver backends `tiny-solver`
# and `factrs` (below), not by taste: `vision-calibration-optim` hands
# nalgebra and faer types straight across both boundaries (`Factor<T:
# nalgebra::RealField>`, factrs variables, `faer::sparse::SparseColMat`,
# `faer_ext::IntoNalgebra`), so all three must match what both were built
# against. As of tiny-solver 0.18 and factrs 0.3 that is nalgebra 0.34 /
# faer 0.23 / faer-ext 0.7. Bumping any of them ahead of either backend does
# not compile — re-check on each backend release.
nalgebra = { version = "0.34", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
image = { version = "0.25" }

glob = "0.3"
regex = "1"
# Default features off: `sys_rng`/`thread_rng` pull `getrandom`, which does not
# build for `wasm32-unknown-unknown` without a JS backend. Library crates only
# need seeded RNGs (determinism rule), so each member opts into the features it
# uses.
rand = { version = "0.10", default-features = false }
tracing = { version = "0.1" }
# 0.18.7 is the floor: `Problem::compute_cost` (the robust objective the
# LM measures), the Cauchy loss fix, and an `SO3::exp` that is accurate to
# machine precision at small angles and keeps its sign beyond 2π — the
# rotation update of our SE(3) and quaternion retractions.
tiny-solver = "0.18.7"
# The dual numbers tiny-solver differentiates with, for the projection
# Jacobian `vision-calibration-optim` takes outside a solve; keep in step
# with tiny-solver so the tree holds one copy.
num-dual = "0.12.1"
# No optional features: `serde` (typetag), `rerun` and `left` (the left
# retraction convention) stay off, and `f32` would break the f64 kernels.
factrs = { version = "0.3", default-features = false }
faer = "0.23"
faer-ext = "0.7"
criterion = "0.8"

# `calib-targets`' default feature set includes `cli`, which drags `clap` and
# a binary target into every consumer. We only need the `image`-backed
# `detect` helpers. The detector crates may use a newer nalgebra than the
# solver stack: `vision-calibration-detect` converts to plain arrays at its
# boundary.
calib-targets = { version = "0.16.1", default-features = false, features = ["image"] }
ringgrid = "0.13.2"

[workspace.lints.rust]
missing_docs = "warn"

# Tests are numerical: unoptimized nalgebra and dual-number autodiff run the
# solver tests about 8x slower. Optimize dependencies in every dev build, and
# the workspace crates in test builds (generic numeric code is instantiated
# in them). Debug assertions stay on in both.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
