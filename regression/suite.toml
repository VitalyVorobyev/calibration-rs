# The calibration-rs regression suite.
#
# Each entry is a set of image-free observations (`observations/<id>.json`,
# checksummed in `SHA256SUMS`) and the reference result calibration-rs
# produces from them (`results/<id>/calibration-rs.json`). The format and
# the commands are described in the book chapter "Regression suite".
#
#   cargo run -p vision-calibration-bench --bin calib-bench -- suite check
#
# Paths are relative to this file. `config` tables are merged into the
# problem's default config; `tolerance` (default rel = 1e-6, abs = 1e-9)
# bounds the drift of every number in the result. A `synthetic` entry names
# the benchmark scene its observations and truth (`truth/<id>.json`) were
# frozen from.
#
# `licence` is an SPDX identifier; `NOASSERTION` marks data whose publisher
# states no licence, used here with the attribution its authors ask for.
#
# `fetch` says where `suite fetch` downloads an image entry's files from:
# `files` (each file from `base_url` + its path) or `zip` (one archive, whose
# `root` directory is the dataset root). `fetch/<id>.sha256` lists the files
# with their SHA-256. An image entry without `fetch` is downloaded by hand
# from `source_url`.
#
# `corners` freezes an entry from the corner files its publisher released
# instead of from detection on the images: `format` (`opencv_storage`, the
# `cv::FileStorage` XML of OpenCV's calibration tests, nodes `image_0`,
# `image_1`, ...), the `problem` (`planar_intrinsics` or `rig_extrinsics`),
# the `object` file of target points and, per camera, its `points` file and
# `image_size`. The files are fetched like images.

suite_version = "2026.1"

