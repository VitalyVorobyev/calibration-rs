# Fisheye entries: OpenCV's own fisheye test set, frozen from the corner
# files OpenCV publishes with the images (`corners`), so calibration-rs and
# OpenCV calibrate exactly the same points.

[[entry]]
id = "opencv_fisheye_left"
description = "Fisheye (Kannala-Brandt) planar intrinsics, left camera of OpenCV's fisheye stereo test set: 34 views of an 8x6 chessboard (24.4 mm), 1280x800"
licence = "NOASSERTION"
citation = "OpenCV test data (opencv_extra), testdata/cv/cameracalibration/fisheye/calib-3_stereo_from_JY: the stereo fisheye set of the cv::fisheye calibration tests. https://github.com/opencv/opencv_extra"
source_url = "https://github.com/opencv/opencv_extra/tree/ebf9366b3845efe1e54bf2440cf238fd68905bab/testdata/cv/cameracalibration/fisheye/calib-3_stereo_from_JY"
fetch = { kind = "files", base_url = "https://raw.githubusercontent.com/opencv/opencv_extra/ebf9366b3845efe1e54bf2440cf238fd68905bab/testdata/cv/cameracalibration/fisheye/calib-3_stereo_from_JY/" }
config = { camera = { model = { projection = "equidistant", distortion = "kannala_brandt4" } } }

[entry.corners]
format = "opencv_storage"
problem = "planar_intrinsics"
object = "object.xml"
cameras = [{ id = "left", points = "left.xml", image_size = [1280, 800] }]

