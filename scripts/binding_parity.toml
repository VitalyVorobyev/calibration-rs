# Every public item of the facade (crates/vision-calibration/src/lib.rs),
# keyed by its path under `vision_calibration::`, mapped to the Python names
# that bind it ([bound]) or to the reason it stays Rust-only ([rust_only]).
# `scripts/check_binding_parity.py --check` fails on an unmapped facade item,
# a stale entry or a Python name the package does not define.
#
# Python names: a name in the package's `__all__`; `module.Name` in one of
# its modules (`types.X` are the generated payload TypedDicts);
# `module.Class.member`; or `builtins.X` for a Python built-in.

