# Every public item of the facade (crates/vision-calibration/src/lib.rs),
# keyed by its path under `vision_calibration::`, mapped to the Python names
# that bind it ([bound]) or to the reason it stays Rust-only ([rust_only]).
# `scripts/check_binding_parity.py --check` fails on an unmapped facade item,
# a stale entry or a Python name the package does not define.
#
# Python names: a name in the package's `__all__`; `module.Name` in one of
# its modules (`types.X` are the generated payload TypedDicts);
# `module.Class.member`; or `builtins.X` for a Python built-in.

# Python-native spellings kept on purpose (ADR 0024, "Python"):
#   CameraModel          the built camera model, the Rust `CameraModel`
#   PinholeIntrinsics    `FxFyCxCy`; Python names the pinhole matrix by what it is
#   Division1Distortion, Rational8Distortion, ThinPrism9Distortion
#                        `Division`, `RationalPolynomial`, `ThinPrism`, each with
#                        the `Distortion` suffix Python's flat namespace needs and
#                        the coefficient count its payload carries
#   Features             the numpy columns of `Vec<Feature>`; `CachedFeatures` is
#                        the cache's one-field wrapper around that vector
#   RigEyeInHand, RigEyeToHand, CameraEyeInHand, CameraEyeToHand
#                        the variants of `HandeyeSolution` and
#                        `SingleCamHandeyeSolution`, one class per mode

