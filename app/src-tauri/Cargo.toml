[package]
name = "calibration-diagnose"
version = "0.1.0"
description = "calibration-rs diagnose UI (Tauri 2 + React)"
authors = ["Vitaly Vorobyev <vit.vorobiev@gmail.com>"]
license = "MIT"
repository = "https://github.com/VitalyVorobyev/calibration-rs"
edition = "2024"
rust-version = "1.93"
publish = false

# This crate is intentionally NOT a member of the root Cargo workspace
# (`/Cargo.toml`) — Tauri's tauri-build pulls in a substantial build-time
# dep tree that we do not want polluting `cargo build --workspace` for
# the calibration library itself. Build it from inside `app/` (or via
# `npm run tauri dev`), not from the repo root.

[lib]
name = "calibration_diagnose_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# JSON Schema emitter (B-QUAL2). Behind `required-features` so `tauri dev`
# and the default clippy/test build never pull in schemars; only
# `bun run generate:types` / the CI drift check build it with
# `--features schema-export`.
[[bin]]
name = "emit_schemas"
path = "src/bin/emit_schemas.rs"
required-features = ["schema-export"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
image = "0.25"
vision-calibration = { path = "../../crates/vision-calibration" }
# Laser-line extraction (ADR 0021). vision-metrology is not on
# crates.io, so the published pipeline crates only define the
# `LaserPixelExtractor` trait; this (unpublished) app provides the
# implementation. Same pin as vision-calibration-bench.
vision-metrology = { git = "https://github.com/VitalyVorobyev/vision-metrology.git", tag = "v0.1.0" }
dirs = "5"
# Optional: only pulled in by the `schema-export` feature for the
# `emit_schemas` binary. schemars 1.x, matching the workspace pin.
schemars = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[features]
# Avoid touching the embed_plist build hooks unless explicitly running
# `cargo tauri build`. `tauri dev` enables what it needs from the CLI.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# JSON Schema emission (B-QUAL2): derive `JsonSchema` on the Tauri
# command payload/response types and forward the facade's `schemars`
# feature so the `*Export` types are schema-able too.
schema-export = ["dep:schemars", "vision-calibration/schemars"]
