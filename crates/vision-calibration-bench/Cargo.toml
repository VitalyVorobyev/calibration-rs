[package]
name = "vision-calibration-bench"
description = "Benchmarking harness for calibration-rs: dataset registry, metric records, stability and cross-validation testing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["tier-a"]
tier-a = []
tier-b = [
    "dep:image",
    "dep:vision-calibration-detect",
    "dep:ureq",
    "dep:zip",
]
laser = ["dep:vision-metrology"]
# JSON Schemas of the suite's file formats (`cargo xtask emit-schemas`).
schema = [
    "dep:schemars",
    "vision-calibration-core/schemars",
    "vision-calibration-optim/schemars",
    "vision-calibration-pipeline/schemars",
]

[[bin]]
name = "calib-bench"
path = "src/bin/calib_bench.rs"

[dependencies]
vision-calibration = { workspace = true }
vision-calibration-core = { workspace = true }
vision-calibration-optim = { workspace = true }
vision-calibration-dataset = { workspace = true }
vision-calibration-pipeline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
# Math for the solver and suite studies; already a transitive dep.
nalgebra = { workspace = true }
# Regression suite: `suite.toml` and the observation-file checksums.
toml = "1"
sha2 = "0.10"
schemars = { workspace = true, optional = true }

# Tier-B (detection through the pipeline's dataset runner, image I/O) — gated
# behind `tier-b`.
image = { workspace = true, optional = true }
# The detection cache the dataset runner reads and writes.
vision-calibration-detect = { workspace = true, optional = true }
# `suite fetch`: downloads a regression entry's images from their publisher
# over HTTPS (pure-Rust TLS, the same on every platform) and unpacks a
# published ZIP archive (deflate only).
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
vision-metrology = { git = "https://github.com/VitalyVorobyev/vision-metrology.git", tag = "v0.1.0", optional = true }

[dev-dependencies]
# Checks the registry's rig pairing token as the dataset runner applies it.
regex = { workspace = true }
