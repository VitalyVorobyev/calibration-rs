[package]
name = "vision-calibration-detect"
description = "Calibration-target feature detectors (chessboard, charuco, puzzleboard, ringgrid) with content-addressed cache"
readme = "README.md"
keywords = ["camera", "calibration", "computer-vision", "detection", "chessboard"]
categories = ["computer-vision"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["chessboard", "charuco", "puzzleboard", "ringgrid"]
chessboard = ["dep:calib-targets"]
charuco = ["dep:calib-targets"]
puzzleboard = ["dep:calib-targets"]
ringgrid = ["dep:ringgrid"]
schemars = ["dep:schemars"]

[dependencies]
serde = { workspace = true }
# `float_roundtrip`: a detection read back from the cache must equal the one
# stored, to the bit (the default parser can land one ulp off).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
image = { workspace = true }
schemars = { workspace = true, optional = true }
calib-targets = { workspace = true, optional = true }
ringgrid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
