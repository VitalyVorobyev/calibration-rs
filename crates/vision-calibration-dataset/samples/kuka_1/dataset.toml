# Single-camera hand-eye, eye-in-hand: dataset `kuka_1` of RWHE-Calib.
#
# 30 chessboard views (`01.png`–`30.png`) from a camera on a KUKA arm.
# `RobotPosesVec.txt` holds one row-major 4×4 matrix per line, the gripper
# (TCP) in the robot base frame, in metres; image `NN.png` pairs with pose
# row `NN`. The board has 17×28 interior corners of 20 mm.

version = 1
topology = "single_cam_handeye"
description = "kuka_1"

[[cameras]]
id = "cam0"
images = { kind = "glob", pattern = "*.png" }

[target]
kind = "chessboard"
rows = 17
cols = 28
square_size_m = 0.02

[robot_poses]
path = "RobotPosesVec.txt"
format = "rowmajor4x4"

[pose_pairing]
kind = "by_index"

[pose_convention]
transform = "t_base_tcp"
rotation_format = "matrix4x4_row_major"
translation_units = "m"
