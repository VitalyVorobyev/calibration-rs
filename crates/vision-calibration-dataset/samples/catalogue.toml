# The sample datasets `samples::fetch` downloads.
#
# Each sample is downloaded from its publisher, at a pinned revision, into
# `<cache>/<id>/`. `<id>/files.sha256` lists every file the sample's
# manifest reads, by its path under the dataset root, with its SHA-256;
# `<id>/dataset.toml` is the manifest written next to them.
#
# `licence` is an SPDX identifier; `NOASSERTION` marks data whose publisher
# states no licence, used with the attribution its authors ask for.
#
# `source` is where the files come from: `files` (each file from `base_url`
# followed by its path) or `zip` (one archive, whose `root` directory is the
# dataset root).

[[sample]]
id = "opencv_left"
description = "Planar intrinsics: 13 views of a 6x9 chessboard, the left camera of OpenCV's stereo sample (640x480)"
licence = "Apache-2.0"
citation = "OpenCV, samples/data/left01.jpg to left14.jpg. https://github.com/opencv/opencv"
source_url = "https://github.com/opencv/opencv/tree/d195a5ad7eb52aafc3585e494a9af2dc06a3b111/samples/data"
source = { kind = "files", base_url = "https://raw.githubusercontent.com/opencv/opencv/d195a5ad7eb52aafc3585e494a9af2dc06a3b111/samples/data/" }

[[sample]]
id = "opencv_fisheye_stereo"
description = "Fisheye stereo rig: 34 synchronised views of a 6x8 chessboard (24.4 mm), OpenCV's fisheye test set (1280x800); calibrate with the equidistant projection and Kannala-Brandt distortion"
licence = "NOASSERTION"
citation = "OpenCV test data (opencv_extra), testdata/cv/cameracalibration/fisheye/calib-3_stereo_from_JY. https://github.com/opencv/opencv_extra"
source_url = "https://github.com/opencv/opencv_extra/tree/ebf9366b3845efe1e54bf2440cf238fd68905bab/testdata/cv/cameracalibration/fisheye/calib-3_stereo_from_JY"
source = { kind = "files", base_url = "https://raw.githubusercontent.com/opencv/opencv_extra/ebf9366b3845efe1e54bf2440cf238fd68905bab/testdata/cv/cameracalibration/fisheye/calib-3_stereo_from_JY/" }

