[package]
name = "vision-calibration-linear"
readme = "README.md"
description = "Closed-form and linear initialization solvers for calibration-rs"
keywords = ["camera", "calibration", "computer-vision", "robotics", "hand-eye"]  # max 5
categories = ["computer-vision"]  # pick from crates.io list
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `schemars::JsonSchema` on the types that appear in workflow configs.
schemars = ["dep:schemars", "vision-calibration-core/schemars"]

[dependencies]
vision-calibration-core = { workspace = true }
vision-geometry = { workspace = true }
nalgebra = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
vision-calibration-core = { workspace = true, features = ["synthetic", "test-utils"] }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "linear_init"
harness = false
