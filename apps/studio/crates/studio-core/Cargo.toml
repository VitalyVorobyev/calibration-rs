[package]
name = "studio-core"
version = "0.1.0"
description = "Calibration Studio's back end: everything the desktop app and the browser viewer compute"
authors = ["Vitaly Vorobyev <vit.vorobiev@gmail.com>"]
license = "MIT"
repository = "https://github.com/VitalyVorobyev/calibration-rs"
edition = "2024"
rust-version = "1.93"
publish = false

# Writes `apps/studio/schema/studio-api.json` (`--check` compares).
[[bin]]
name = "studio-schema"
path = "src/bin/studio_schema.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content addresses: image cache keys, blob ids, entity tags.
sha2 = "0.10"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
image = "0.25"
# `fetch`: the Quick Start samples download their datasets; `schemars`: the
# library's wire types are part of the API schema.
vision-calibration = { path = "../../../../crates/vision-calibration", features = ["fetch", "schemars"] }
# Laser-line extraction (ADR 0016). vision-metrology is not on
# crates.io, so the published pipeline crates only define the
# `LaserPixelExtractor` trait; this (unpublished) app provides the
# implementation. Same pin as vision-calibration-bench.
vision-metrology = { git = "https://github.com/VitalyVorobyev/vision-metrology.git", tag = "v0.1.0" }
# Canonical paths without the Windows `\\?\` prefix, so the asset scope and
# the webview's `convertFileSrc` URLs name a file the same way.
dunce = "1"
# The platform cache folder, home of the detection cache.
dirs = "5"
# The API schema (`studio-schema`) and the command table's argument and
# reply types. schemars 1.x, matching the workspace pin.
schemars = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# The tests calibrate synthetic views.
vision-calibration = { path = "../../../../crates/vision-calibration", features = ["synthetic"] }
toml = "0.8"
