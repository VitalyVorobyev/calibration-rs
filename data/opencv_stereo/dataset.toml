# Rig extrinsics of OpenCV's stereo calibration sample
# (`samples/data/left01.jpg`–`left14.jpg` and `right01.jpg`–`right14.jpg`,
# no `left10` / `right10`). Download the images into the suite image cache
# with `calib-bench suite fetch --only opencv_stereo`.
#
# 13 synchronised views, 640×480 grayscale, of a chessboard with 6×9
# interior corners, seen turned by 90° in most of them. OpenCV does not
# publish the printed square size, so the board is declared with squares of
# 1: the intrinsics do not depend on it, and the baseline and the board
# poses come out in units of one square.

version = 1
topology = "rig_extrinsics"
description = "OpenCV stereo sample, chessboard 6x9"

[[cameras]]
id = "left"
images = { kind = "glob", pattern = "left*.jpg" }

[[cameras]]
id = "right"
images = { kind = "glob", pattern = "right*.jpg" }

[target]
kind = "chessboard"
rows = 6
cols = 9
square_size_m = 1.0

[pose_pairing]
kind = "by_index"
