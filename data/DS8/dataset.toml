# Rig hand-eye manifest for dataset 8 of "Data from: Solving the
# Robot-World Hand-Eye(s) Calibration Problem with Iterative Methods"
# (Tabb & Ahmad Yousef, USDA ARS, https://doi.org/10.15482/USDA.ADC/1340592;
# U.S. public domain). Unzip DS8.zip in `data/` (its top folder is this one),
# or download it into the suite image cache with `calib-bench suite fetch
# --only ds8`. The images are read as published: RGB TIFF for the JAI
# cameras, colour JPEG for the Senz3D.
#
# Three cameras on a Denso VS-6577GM-B arm, 42 poses: two JAI BB-500
# (1228×1029) and the colour camera of a Creative Senz3D (640×480).
# `robot_cali.txt` holds the pose count, then one 4×4 matrix per pose: the
# robot base in the gripper frame, in millimetres. The board is 10×14
# interior corners of 52 mm (`calibration_object.txt`).
#
# Only complete boards are kept (`min_features_per_view = 140`). The runner
# already drops boards that do not reach every edge, as a plain chessboard
# labels its corners from the detection's own top-left corner; the floor
# also drops boards that reach every edge but miss a corner (two views each
# of camera0 and camera2), the set the regression reference was frozen from.

version = 1
topology = "rig_handeye"
description = "DS8: 3-camera rig hand-eye, chessboard 10x14 52mm"

[[cameras]]
id = "camera0"
images = { kind = "glob", pattern = "images/camera0/*.tiff" }

[[cameras]]
id = "camera1"
images = { kind = "glob", pattern = "images/camera1/*.tiff" }

[[cameras]]
id = "camera2"
images = { kind = "glob", pattern = "images/camera2/*.jpg" }

[target]
kind = "chessboard"
rows = 10
cols = 14
square_size_m = 0.052

[detector]
min_features_per_view = 140

[robot_poses]
path = "robot_cali.txt"
format = "counted4x4"

[pose_pairing]
kind = "by_index"

[pose_convention]
transform = "t_tcp_base"
rotation_format = "matrix4x4_row_major"
translation_units = "mm"
