# Planar intrinsics manifest for the left half of the stereo
# dataset. Pair with `dataset_right.toml` to calibrate each camera in
# isolation, or feed the same data to the RigExtrinsics topology
# directly.
#
# Board parameters: 7×11 interior corners, 30 mm squares.
#
# Images: "Chessboard Pictures for Stereocamera Calibration" by Daniel
# (danielwe14) on Kaggle, which states no licence:
# https://www.kaggle.com/datasets/danielwe14/stereocamera-chessboard-pictures
# Download it and place `leftcamera/` and `rightcamera/` under `imgs/`.

version = 1
topology = "planar_intrinsics"
description = "stereo-left chessboard 7x11 30mm"

[[cameras]]
id = "leftcamera"

[cameras.images]
kind = "glob"
pattern = "imgs/leftcamera/*.png"

[target]
kind = "chessboard"
rows = 7
cols = 11
square_size_m = 0.03
