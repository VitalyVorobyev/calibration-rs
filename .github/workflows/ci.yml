name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Pull requests restore main's cache but do not save their own: saving
      # costs minutes on Windows and a PR's cache is rarely reused.
      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key does not see Cargo profile changes; bump on one.
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Formatting, lints, generated files and docs are platform-independent,
      # so they run on Linux only; tests run on every OS.
      - name: Cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --all-features

      # The app's schema-driven config forms, the input/export schemas in
      # `schemas/` and the Python package's TypedDicts are all generated from
      # the Rust types. Without this gate a struct change silently leaves them
      # stale: a form or a Python type loses (or keeps) a field.
      # Counterpart of the `app-src-tauri` job's wire-type schema check.
      - name: Check generated schemas and Python types are up to date
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p xtask -- emit-schemas --check

      # User-facing docs (READMEs, book, CHANGELOG, published
      # rustdoc, the Python package) must not cite internal material.
      - name: Check user-facing docs
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p xtask -- check-docs

      - name: Cargo doc
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --workspace

  msrv:
    name: MSRV (1.93)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93

      - name: Cargo build (MSRV)
        run: cargo build --workspace --all-features --locked

      - name: Cargo test (MSRV)
        run: cargo test --workspace --locked

  wasm32:
    name: wasm32 build (core + dataset)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Downstream WASM consumers (etendue `@etendue/wasm`) depend on these two
      # crates building for the browser without a `getrandom` JS backend.
      - name: Cargo build (wasm32-unknown-unknown)
        run: cargo build -p vision-calibration-core -p vision-calibration-dataset --target wasm32-unknown-unknown --locked

  # Unit tests that read the committed LFS images (kuka_1). The public
  # datasets' calibrations are gated by the regression suite below; the
  # image-based acceptance run (`calib-bench accept`) is for the private
  # registry, locally.
  lfs-images:
    name: LFS-image tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS data)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key does not see Cargo profile changes; bump on one.
          prefix-key: v1-rust

      # Unit tests that read LFS images are `#[ignore]`d in the build jobs,
      # which check out LFS pointers only.
      - name: LFS-image unit tests
        run: cargo test -p vision-calibration-detect --lib -- --ignored

  # The public regression suite: every entry of `regression/suite.toml`
  # calibrated from its checksummed observations and compared with its
  # reference result. Image-free, so no LFS.
  regression-suite:
    name: Regression suite
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key does not see Cargo profile changes; bump on one.
          prefix-key: v1-rust

      - name: Suite check
        run: >-
          cargo run --release --locked -p vision-calibration-bench
          --bin calib-bench -- suite check

      # The other solver backend reaches the same parameters, within the
      # reference's standard deviations (its last digits differ).
      - name: Suite check (factrs)
        run: >-
          cargo run --release --locked -p vision-calibration-bench
          --bin calib-bench -- suite check --backend factrs --sigma 1

      # The stored results of other libraries still read against the
      # references (the table goes in the book's regression-suite chapter).
      - name: Suite compare
        run: >-
          cargo run --release --locked -p vision-calibration-bench
          --bin calib-bench -- suite compare

  # The parameter-uncertainty Monte-Carlo gates (a few hundred solves each)
  # and the next-view prediction gate (dozens of re-solves) are `#[ignore]`d
  # in the debug test run and run here in release.
  uncertainty-gates:
    name: Uncertainty gates
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key does not see Cargo profile changes; bump on one.
          prefix-key: v1-rust

      - name: Monte-Carlo gates
        run: >-
          cargo test --release --locked -p vision-calibration-optim
          --test uncertainty -- --ignored

      - name: Next-view prediction gate
        run: >-
          cargo test --release --locked -p vision-calibration-pipeline
          --lib analysis::next_view -- --ignored

  python-runtime:
    name: Python Runtime Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      # Static source checks (read only .py/.pyi/.rs) run before the expensive
      # extension build so drift fails fast.
      - name: Check typing-stub coverage
        run: python3 scripts/check_pyi_coverage.py --check

      - name: Check facade↔binding parity
        run: python3 scripts/check_binding_parity.py --check

      - name: Build Python extension
        run: maturin develop -m crates/vision-calibration-py/Cargo.toml

      - name: Validate Python package
        run: python -m compileall crates/vision-calibration-py/python/vision_calibration

      - name: Run Python runtime tests
        run: python -m unittest discover -s crates/vision-calibration-py/tests -p "test_*.py"

  app-frontend:
    name: App frontend (lint/format/typecheck/test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: app
        run: bun run lint

      - name: Format check
        working-directory: app
        run: bun run format:check

      - name: Typecheck
        working-directory: app
        run: bun run typecheck

      - name: Test
        working-directory: app
        run: bun run test

      # Playwright smoke: boots the plain Vite dev server (no
      # Tauri build, no Rust toolchain) and drives it in real Chromium.
      # Tauri IPC is either absent (empty-state assertions) or mocked at
      # the `window.__TAURI_INTERNALS__` seam per-spec — see
      # `app/e2e/support/tauriMock.ts` and `app/README.md`'s dev notes on
      # the Tauri-native vs mocked-IPC boundary.
      #
      # Cache the downloaded browser binaries keyed on the lockfile (the
      # Playwright version they match); `--with-deps` still runs on a cache
      # hit so the OS-level (apt) dependencies stay installed, but it's a
      # no-op for the browser download itself.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/bun.lock') }}

      - name: Install Playwright browsers
        working-directory: app
        run: bunx playwright install chromium --with-deps

      - name: E2E smoke (Playwright)
        working-directory: app
        run: bun run test:e2e

      # Drift stage 2 (schema → TypeScript, bun-only). Regenerate the TS from
      # the committed schema and fail if it differs from what's checked in.
      # Stage 1 (Rust → schema) lives in the `app-src-tauri` job, which has the
      # cargo toolchain; splitting keeps this job Rust-free (`bun run generate:types`
      # regenerates both stages locally).
      - name: Check generated types are up to date
        working-directory: app
        run: |
          bun run generate:types:ts
          git diff --exit-code src/types/generated

  # `app/src-tauri` is excluded from the root Cargo workspace (see its
  # Cargo.toml) so it doesn't pull Tauri's build-time dep tree into
  # `cargo build --workspace`. It gets its own job, gated with
  # `--manifest-path` the same way the release docs already tell
  # contributors to build it locally.
  app-src-tauri:
    name: App src-tauri (fmt/clippy/test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri 2's Linux backend links against GTK/WebKitGTK at build time;
      # these are the packages tauri-apps' own CI recipes install on
      # ubuntu-latest.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Cargo fmt (src-tauri)
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check

      # `schema-export` is additive (only gates the extra `emit_schemas` bin +
      # its `schemars` derives behind `required-features`/`#[cfg]`, never
      # removes code), so one clippy pass with the feature enabled covers
      # both the default build and the schema emitter.
      - name: Cargo clippy (src-tauri)
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets --features schema-export -- -D warnings

      - name: Cargo test (src-tauri)
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      # Drift stage 1 (Rust wire types → JSON schema, cargo-only). Fails if a
      # `*Export` / command-type change wasn't regenerated. Stage 2 (schema →
      # TypeScript) runs in the bun-only `app-frontend` job (`bun run generate:types`
      # regenerates both stages locally).
      - name: Check generated schema is up to date
        run: cargo run --manifest-path app/src-tauri/Cargo.toml --features schema-export --bin emit_schemas -- --check
