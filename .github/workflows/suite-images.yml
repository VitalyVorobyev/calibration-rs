name: Suite images

# Downloads the regression suite's public images (and published corner
# files) from their publishers (`calib-bench suite fetch`), re-freezes those
# entries' observations from them and fails when the result differs from the committed observations
# and `regression/SHA256SUMS`: a publisher changed its files, or the
# detector moved the observations without a re-freeze. The checkout has no
# LFS data, so the images can only come from the publishers.
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "regression/suite.toml"
      - "regression/fetch/**"
      - "data/*/dataset.toml"
      - "crates/vision-calibration-bench/src/suite/fetch.rs"
      - "crates/vision-calibration-bench/src/suite/corners.rs"
      - ".github/workflows/suite-images.yml"

permissions:
  contents: read

jobs:
  fetch-freeze:
    name: Fetch and re-freeze
    # The observations are frozen on Apple-silicon macOS. Corner detection
    # is not bit-identical across platforms: on x86-64 Linux the same
    # images give corners up to ~1e-3 px apart, which changes the bytes.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key does not see Cargo profile changes; bump on one.
          prefix-key: v1-rust

      - name: Suite fetch
        run: >-
          cargo run --release --locked -p vision-calibration-bench --features tier-b
          --bin calib-bench -- suite fetch

      - name: Suite freeze from the fetched images
        run: >-
          cargo run --release --locked -p vision-calibration-bench --features tier-b
          --bin calib-bench -- suite freeze --images target/suite-images

      - name: Observations match SHA256SUMS
        run: |
          git status --short -- regression
          git diff --stat --exit-code -- regression

      # On a mismatch, keep the re-frozen observations for comparison.
      - name: Upload the re-frozen observations
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: refrozen-observations
          path: |
            regression/SHA256SUMS
            regression/observations/
